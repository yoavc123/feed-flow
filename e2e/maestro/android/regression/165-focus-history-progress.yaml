appId: com.prof18.feedflow.debug
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=reader-mode
- assertVisible: "E2E seed complete"
- tapOn:
    id: e2e_open_app
- tapOn:
    id: home_more_menu_button
- tapOn: "Focus"
- assertVisible: "Focus"
- assertVisible: "E2E Reader Mode Success Article.*"
- tapOn:
    text: "E2E Reader Mode Success Article.*"
- assertVisible: "Just started"
- tapOn:
    id: reader_back_button
- back
- tapOn:
    id: home_search_button
- tapOn:
    id: search_filter_history
- tapOn:
    id: search_query_field
- inputText: E2E Reader Mode Success
- hideKeyboard
- extendedWaitUntil:
    visible: "E2E Reader Mode Success Article.*"
    timeout: 5000
