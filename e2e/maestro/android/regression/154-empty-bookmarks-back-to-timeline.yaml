appId: com.prof18.feedflow.debug
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=content-rich
- extendedWaitUntil:
    visible:
      id: e2e_seed_complete
    timeout: 15000
- tapOn:
    id: e2e_open_app

# Filter on Saved. content-rich seeds two saved articles, so remove both
# via the context menu to reach the empty Saved state.
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_bookmarks
- assertVisible:
    id: article_row_e2e_article_bookmarked_unread
- longPressOn:
    id: article_row_e2e_article_bookmarked_unread
- tapOn: "Remove from bookmarks"
- assertVisible:
    id: article_row_e2e_article_bookmarked_read
- longPressOn:
    id: article_row_e2e_article_bookmarked_read
- tapOn: "Remove from bookmarks"

# Empty Saved state offers a calm route back to Flow.
- assertVisible: "Nothing saved yet.*"
- assertVisible: "Back to Flow"
- tapOn: "Back to Flow"

# Back in Flow the seeded top articles are visible again.
- extendedWaitUntil:
    visible:
      text: "E2E Newest Unread Article.*"
    timeout: 10000
