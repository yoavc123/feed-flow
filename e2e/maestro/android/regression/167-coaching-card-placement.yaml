appId: com.prof18.feedflow.debug
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=large-content
- assertVisible: "E2E seed complete"
- tapOn:
    id: e2e_open_app
- assertVisible: "Android Central RSS Feed is filling your Flow.*"
- tapOn:
    id: calm_coaching_tune_source
- assertVisible: "Source pace"
- assertVisible:
    id: edit_feed_save
