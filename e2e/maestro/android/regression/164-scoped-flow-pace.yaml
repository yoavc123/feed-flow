appId: com.prof18.feedflow.debug
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=content-rich
- assertVisible: "E2E seed complete"
- tapOn:
    id: e2e_open_app
- tapOn:
    id: drawer_menu_button
- scrollUntilVisible:
    element:
      id: drawer_category_expand_e2e_category_technology
    direction: DOWN
    timeout: 10000
- tapOn:
    id: drawer_category_expand_e2e_category_technology
- scrollUntilVisible:
    element:
      id: drawer_feed_source_e2e_feed_android_weekly
    direction: DOWN
    timeout: 10000
- longPressOn:
    id: drawer_feed_source_e2e_feed_android_weekly
- tapOn: "Edit feed"
- scrollUntilVisible:
    element:
      text: "Source pace"
    direction: DOWN
    timeout: 10000
- tapOn: "Source pace"
- tapOn: "Flash.*3 hours"
- tapOn:
    id: edit_feed_save

- tapOn:
    id: drawer_menu_button
    optional: true
- tapOn:
    id: drawer_timeline
    optional: true
- assertVisible: "E2E Newest Unread Article.*"

- tapOn:
    id: drawer_menu_button
- scrollUntilVisible:
    element:
      id: drawer_category_e2e_category_technology
    direction: DOWN
    timeout: 10000
- tapOn:
    id: drawer_category_e2e_category_technology
- assertVisible: "E2E Newest Unread Article.*"
- tapOn:
    id: drawer_menu_button
- scrollUntilVisible:
    element:
      id: drawer_feed_source_e2e_feed_android_weekly
    direction: DOWN
    timeout: 10000
- longPressOn:
    id: drawer_feed_source_e2e_feed_android_weekly
- tapOn: "Edit feed"
- scrollUntilVisible:
    element:
      text: "Source pace"
    direction: DOWN
    timeout: 10000
- assertVisible: "Flash.*3 hours"
