appId: com.prof18.feedflow.debug
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=content-rich
- assertVisible: "E2E seed complete"
- tapOn:
    id: e2e_open_app
- longPressOn:
    id: article_row_e2e_article_newest_unread
- tapOn:
    text: "Let Go"
- assertNotVisible:
    id: article_row_e2e_article_newest_unread
- assertVisible: "Article released from your Flow"
- tapOn: "Undo"
- assertVisible:
    id: article_row_e2e_article_newest_unread
- longPressOn:
    id: article_row_e2e_article_newest_unread
- tapOn:
    text: "Add to bookmarks"
- tapOn:
    id: drawer_menu_button
- tapOn:
    id: drawer_bookmarks
- assertVisible:
    id: article_row_e2e_article_newest_unread
