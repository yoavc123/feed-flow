appId: com.prof18.feedflow.debug
---
- launchApp
- openLink: feedflow://e2e/reset-and-seed?profile=content-rich
- assertVisible: "E2E seed complete"
- tapOn:
    id: e2e_open_app
- tapOn:
    id: home_more_menu_button
- assertVisible: "Sort & filter"
- assertVisible: "Release expired articles"
- tapOn: "Sort & filter"
- assertVisible: "Sort by Date"
- tapOn: "Oldest First"
- back
- tapOn:
    id: home_more_menu_button
- tapOn: "Release expired articles"
- assertVisible: "Remove articles that have already flowed past the seven-day horizon? Saved articles stay available."
- tapOn: "Cancel"
