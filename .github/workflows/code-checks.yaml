name: Code Checks
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-gradle
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Refresh translations
        run: bash .scripts/refresh-translations.sh

      - name: Create dummy Firebase json
        run: |
          cp config/dummy-google-services.json androidApp/src/debug/google-services.json
          cp config/dummy-google-services.json androidApp/src/release/google-services.json

      - name: Run Checks
        run: ./gradlew --quiet --console=plain detekt allTests

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/*    

  build-android-app:
    name: Build Android App
    runs-on: ubuntu-latest
    needs: [ checks ]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-gradle
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Refresh translations
        run: bash .scripts/refresh-translations.sh

      - name: Create dummy Firebase json
        run: |
          cp config/dummy-google-services.json androidApp/src/debug/google-services.json
          cp config/dummy-google-services.json androidApp/src/release/google-services.json 

      - name: Build Android Sample
        run: ./gradlew --quiet --console=plain :androidApp:assembleGooglePlayDebug
